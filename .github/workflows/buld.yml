name: Build Release APK

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug & release keystore (public signature)
        run: |
          # Generate a public debug keystore for CI builds
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AutoClickDebug, OU=Dev, O=AutoClick, L=Tehran, S=Tehran, C=IR"
          fi
          # Generate a release keystore (public, checked-in password autoclick123) so build never fails without secrets
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -storepass autoclick123 -alias autoclick -keypass autoclick123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AutoClick, OU=AutoClick, O=AutoClick, L=Tehran, S=Tehran, C=IR"
          fi
          ls -lh *.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Gradle Wrapper jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar"
            curl -sL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar || \
            wget -q -O gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.6-bin.zip
            # fallback: use gradle wrapper generation via sdkmanager wrapper? We'll try to fetch via maven
            if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
              curl -L -o gradle/wrapper/gradle-wrapper.jar https://repo1.maven.org/maven2/org/gradle/wrapper/gradle-wrapper/8.6/gradle-wrapper-8.6.jar || true
            fi
          fi
          ls -lh gradle/wrapper/

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
