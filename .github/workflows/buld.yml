name: Build Release APK

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Generate debug & release keystore (public signature)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AutoClickDebug, OU=Dev, O=AutoClick, L=Tehran, S=Tehran, C=IR"
          fi
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -storepass autoclick123 -alias autoclick -keypass autoclick123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AutoClick, OU=AutoClick, O=AutoClick, L=Tehran, S=Tehran, C=IR"
          fi
          ls -lh *.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Generate Gradle Wrapper jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.6
          fi
          ls -lh gradle/wrapper/

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
